# ============================================================================
# 预设：五源合并数据（objects / gqa / sky / aerial / fitrs，110,150 张选片）
#
# 用法（追加到你的 local.yaml 末尾，不是替换）：
#     cat config/preset_five_source.yaml >> config/local.yaml
#
# 【本文件只动任务配比，不动阈值】。阈值你已经按 analyze.py 调定并写进
# local.yaml 了（min_area_ratio 0.0002 / min_short_side_px 10 /
# size_easy_px 64 / size_medium_px 30 / size_reject_px 15 /
# dense_medium 9 / dense_hard 50 / hard_quota 0.10），这里再写一遍只会在
# 下次调阈值时留下一份静默盖住新值的旧副本。
#
# ---------------------------------------------------------------------------
# 为什么有六个任务是 0
# ---------------------------------------------------------------------------
# 选片清单里【110,150 行全部】带 disallowed_tasks，列的是：
#     inventory_locate  detect_class  count_class  exist_negative
# 上游的意思是：这批标注【没有逐图核过「该类是否已标全」】。这四个任务的
# 正确性全都压在「图里这一类的框是全的」这个前提上：
#     detect_class     「框出所有的卡车」—— 漏一个就是错标签
#     count_class      「有几辆卡车」—— 漏一个就是错数
#     inventory_locate 「图里有哪几类」—— 漏一类就是错清单
#     exist_negative   「有没有直升机」答「没有」—— 没标≠没有，直接教模型说谎
# 前提不成立时这些样本不是「质量差一点」，是【方向错的监督信号】，比不出更坏。
#
# 另外两个清单没列、但吃同一个前提，一并设 0：
#     detect_describe  第一轮就是「框出所有的 X」，和 detect_class 同一个前提
#     ground_unique    挑「该类在原始标注里仅一个实例」的框来出唯一指代，
#                      标注不全时「仅一个」可能只是【只标了一个】
#
# 剩下三个非主线任务不吃这个前提 —— 它们都是【给定一个框】问这个框自己的事
# （颜色 / 是什么 / 在谁的哪一侧），框是标出来的，不依赖别的框标没标全。
#
# ---------------------------------------------------------------------------
# 剩下的十个怎么配到 70 / 30
# ---------------------------------------------------------------------------
# 原配比里主线 70 分摊在 10 个任务上（七个 ground_* 56 + 另外三个 14），
# 非主线 30 分摊在 6 个任务上。砍掉六个之后如果不重配，实际会变成
# 56 : 12 = 82.4% : 17.6%，主线超配、非主线塌掉。
# 下面把两组各自等比放大回 70 和 30：ground_* ×1.25，非主线 ×2.5。
tasks:
  ground_appearance:  15    # 12 × 1.25
  ground_full:        11    #  9
  ground_relation:    10    #  8
  ground_state:       10    #  8
  ground_part:         9    #  7
  ground_position:     9    #  7
  ground_contrast:     6    #  5
  #                   ---
  #                    70   主线

  attribute_qa:       15    #  6 × 2.5
  region_identify:    10    #  4
  spatial_relation:    5    #  2   同类密集的图上可用率低，出不来的份额由
                            #      组配额流给上面两个，不会拖垮非主线这一组
  #                   ---
  #                    30   非主线

  # —— 以下六个：标注完备性前提不成立，见上 ——
  detect_class:        0
  count_class:         0
  inventory_locate:    0
  exist_negative:      0
  detect_describe:     0
  ground_unique:       0
