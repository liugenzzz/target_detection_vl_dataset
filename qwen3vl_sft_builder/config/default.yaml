# ============================================================================
# 默认配置。本文件进版本控制，不要在服务器上直接改它。
# 服务器上复制 local.yaml.example 为 local.yaml 再改，local.yaml 会覆盖本文件。
# ============================================================================

paths:
  labels_dir: ""                      # YOLO 标注目录（*.txt）
  images_dir: ""                      # 图片目录
  classes_yaml: ""                    # 类别表 yaml（347 类那份）
  output_dir: "./output"

# ---------------------------------------------------------------------------
# 自建 Qwen 服务：用于生成第三轮的描述语句和同类目标的视觉指代
# ---------------------------------------------------------------------------
vlm:
  enabled: true                       # false = 全部回落到模板生成，不调服务
  api_url: "http://192.168.78.36:3012/v1/chat/completions"
  api_key: ""                         # 建议用环境变量 VLM_API_KEY 注入
  model: "Qwen3.6-27B"
  timeout: 300
  temperature: 0.35
  # 「挑对象 + 生成问句」那次调用单用一个更高的温度 —— 要它写出三种明显不同的
  # 说法，温度低了三句会写得几乎一样，问法就不丰富了。
  temperature_select: 0.85
  max_tokens: 1024
  concurrency: 4                      # 并发请求数，先小后大，看服务承载
  # 模型池。上面的 api_url/model/concurrency 是「只有一路」的写法，够用就别动。
  # 要用多台机器或多个模型分担时，在这里列出来 —— 总并发是各路 concurrency
  # 之和，请求轮转分发，某一路 401 或模型名不对只摘除那一路，其余照跑。
  # 各路的 api_key 不写就继承上面的。缓存键不含模型名，所以池子里应该放
  # 【可互换】的模型；换成能力明显不同的模型，请顺手换个 cache_dir。
  #
  # endpoints:
  #   - {name: "主力", api_url: "http://192.168.78.36:3012/v1/chat/completions",
  #      model: "Qwen3.6-27B", concurrency: 8}
  #   - {name: "备用", api_url: "http://192.168.78.37:3012/v1/chat/completions",
  #      model: "Qwen2.5-VL-72B", concurrency: 4}
  endpoints: []
  # 按角色覆盖。审核尤其需要：用生成它的同一个模型来审自己写的描述，
  # 它会倾向于认同自己的输出。有第二个模型时让审核走那个。
  # 只写 model 就是「同一个地址换个模型名」；写 endpoints 则整个池子换掉。
  #
  # roles:
  #   review:
  #     temperature: 0.0
  #     endpoints:
  #       - {name: "质检", api_url: "http://192.168.78.40:3012/v1/chat/completions",
  #          model: "Qwen2.5-VL-72B", concurrency: 4}
  roles: {}
  max_retries: 3
  cache_dir: "./output/vlm_cache"     # 按图落盘，支持断点续跑

# ---------------------------------------------------------------------------
# 扩充问法库。prompts/ 下每个「多问法」文件手写只有五六条，一万条样本摊下来
# 同一句话要重复上千遍，模型会把问句当固定口令背下来。这里用一次性的纯文本调用
# 把每个池子扩到几十条，结果落盘复用 —— 跟量词表一样，问法与图片无关，只生成一次。
#   python scripts/build_phrase_banks.py
# 文件不存在时构建照常跑，只是问法仍是 .txt 里手写的那几条。
# ---------------------------------------------------------------------------
phrase_banks:
  # 【默认关闭】。实测扩充出来的是「同一个骨架换同义词」——
  # 20 条 ask_describe 全是「<动词>这{mw}{label}的<外观词>、<位置词>及<周边词>。」，
  # 语义一个没变，而且换成了「阐明/剖析/辨析」这种学术腔。
  # 答案池更糟，扩充后出了错句：「返回1辆X的矩形区域。」「不存在X的位置信息。」
  # 描述的多样性现在靠 prompts/describe/ 的七个子类型（内容维度）来做，
  # 定位指令的同义变体手写那十来条已经够用。
  # 想试就把路径填回去：path: "config/phrase_banks.yaml"
  path: ""
  target: 40                          # 每个池子扩到多少条（含手写的）
  batch: 20                           # 一次让模型写几条，太多会开始重复
  max_len: 30                         # 超过这么多字的说法丢掉，问句不该这么长
  temperature: 1.0                    # 就是要它发散，这里比别处都高
  # 全局禁用词，对每个池子都生效。这些句子是【下达给视觉模型的指令】，
  # 不是人和人闲聊 —— 语气词、口头语、客套话、儿化音一律不要。
  # 曾经生成出「诶那辆卡车在哪儿？」「帮我图里的人员框出来？」这种。
  # 每个池子自己的 #! forbid 是语义闸（防止「描述」池混进「问位置」），
  # 这一条是语体闸，两者叠加生效。
  forbid_global: [诶, 哎, 呗, 咋, 啥, 嘛, 哟, 咯, 呢, 呀, 啊,
                  话说, 帮我, 麻烦, 劳驾, 请问, 拜托, 玩意,
                  哪儿, 哪块, 那边儿, 一下子]
  pools:                              # 要扩充哪些池子，对应 prompts/<名字>.txt
    - inv_ask_what
    - inv_answer_what
    - inv_ask_box
    - ask_describe
    - ground_unique
    - detect_class
    - spatial_ask_lr
    - spatial_ask_ud
    - spatial_answer
    - attribute_qa_color
    - attribute_qa_feature
    - exist_ask
    - exist_yes_answer
    - exist_yes_vague
    - exist_no_answer
    - region_identify
    - ground_attribute
    - region_identify_answer

# ---------------------------------------------------------------------------
# 全量质检。构建阶段的过滤全是结构性的（占位符、类别泄漏、描述长度、坐标越界），
# 都不看图。框偏了、参照物是编的、指代不唯一 —— 只有看图才发现得了。
#   python scripts/review.py
# 按图分组，一张图上的样本合并成一次调用。十万条按每图 8 条算约一万两千次调用。
# 不通过的不直接删，落进 *.rejected.jsonl 供人工看 —— 审核模型自己也会看错。
# ---------------------------------------------------------------------------
review:
  min_score: 3                        # 综合分下限。综合分取各维度的【最小值】
  # 单维度下限。编造参照物（grounded）是最要命的，卡得比别的严。
  # 一条描述编了参照物但问句写得漂亮，取平均还有 3 分多，照样进训练集 ——
  # 所以要看短板，不看平均。
  min_dimension:
    grounded: 3
    correct: 3
    # 不看图就能答对的样本训不出东西（「街景图里有没有潜水艇？」答「没有」）。
    # 卡得松一点：它衡量的是训练价值而不是对错，卡太死会把正常的拒答样本清光。
    needs_image: 2
  max_samples_per_call: 8             # 一次让模型判几条，太多它会开始敷衍

# ---------------------------------------------------------------------------
# 坐标系。Qwen3-VL-8B-Instruct 吃 0~1000 归一化坐标。
# ---------------------------------------------------------------------------
coords:
  scale: 1000
  origin: 0                           # 0 = 0~1000；改 1 则输出 1~1000

# ---------------------------------------------------------------------------
# 质量过滤。阈值用【面积占比】而非绝对像素 —— 数据分辨率跨度大
# (128x128 ~ 2048x1440)，绝对像素阈值会对同一目标给出相反判定。
# ---------------------------------------------------------------------------
quality:
  min_area_ratio: 0.001               # 低于此判定太小，看不清
  max_area_ratio: 0.5                 # 高于此判定为全图框，做定位样本无意义
  min_short_side_px: 16               # 辅助条件：原图上本身就糊的目标
  # 曾经这里还有一整套【指代泄漏】词表（max_referring_len / neutral_noun /
  # category_hint_words），管的是「指代短语里不能出现类别名或类别暗示词」。
  # 那套东西服务于最早那版设计 —— 第一轮拿文字指代去问类别。多任务改造之后
  # 没有任何任务是这个形状了（主线问的是坐标，问句里带类别名是正确的；
  # 反过来问类别的 region_identify 用坐标指向目标，没有文字指代），
  # 所以连同它服务的旧路径一起删了。需要时从 git 历史里翻。
  # 【用像素核对模型说的颜色】。模型说「白色车身的卡车」而框落在蓝色卡车上时，
  # 指代就指向了错误的目标，attribute_qa 更是直接答错 —— 这是这个数据集里最伤的
  # 一类错误，因为答案是框，模型会学到「白色」对应蓝色卡车。
  # 颜色能从像素客观量出来，不该靠模型自觉，也不该等质检模型主观打分。
  # 只摘掉对不上的那个颜色说法，不整条丢 —— 模型可能颜色看错但位置类别都对。
  # 判据刻意宽松，只拦明显冲突（航拍小目标、阴影、JPEG 压缩都会让颜色发飘）。
  # 拦下的条数进构建报告的 color_check。
  verify_color_with_pixels: true

  sanity_max_boxes: 1000              # 超过必然是标注文件损坏，不是真有这么多目标

# ---------------------------------------------------------------------------
# 难度分级与配额。总难度取三个维度里最难的一项。
# ---------------------------------------------------------------------------
difficulty:
  qwen_equiv_size: 1024               # 面积占比 -> 模型实际看到的等效像素的基准
  size_easy_px: 64                    # >=64px 等效 -> easy
  size_medium_px: 32                  # >=32px 等效 -> medium
  size_reject_px: 16                  # < 16px 等效 -> 剔除
  dense_medium: 3                     # 同图同类 2~3 个 -> medium
  dense_hard: 8                       # 同图同类 4~8 个 -> hard；超过则无法指代
  hard_quota: 0.10                    # 困难目标在最终数据集中的占比

# ---------------------------------------------------------------------------
# 任务体系与配比
#
# 主线 = ground_unique + ground_spatial + ground_attribute，合计 45%，
# 即「指代物体 -> 框 -> 描述语句」，是绝对大头。拆成三个是为了能分别筛选和
# 分别核算成本 —— 前两个纯模板零成本，第三个要调 VLM。
#
# 每条样本的 metadata.task_type 会写明类型，方便你按类型筛掉不要的。
# 把某个任务的比例设为 0 即可关闭它。比例会自动归一化，不必凑满 100。
# ---------------------------------------------------------------------------
# 当前处于单任务打磨阶段：只开 ground_attribute，其余全部关闭（权重 0）。
# 逐个任务调好后再把权重恢复，注释里是原定配比。
tasks:
  # 主线合计 70%（「指代物体 -> 坐标 -> 描述语句」），其余五个 30%。
  #
  # ground_* 是【同一条链】的七个变体：指代 -> 框 -> 某一种描述。拆开是因为
  # 描述的多样性要来自「答案里装的是什么」，不是问句换说法 —— 每种的答案
  # 信息结构完全不同（只说本体 / 只说方位 / 只说邻接关系……），各自的提示词
  # 在 prompts/describe/<子类型>.txt，可以单独改。不想要哪种就把权重设 0。
  ground_appearance:   7    # 只说物体本身：颜色、形状、部件、载物
  ground_state:        4    # 只说状态动作：停着 / 行驶 / 装载 / 门开着
  ground_part:         4    # 聚焦一个部位展开
  ground_position:     3    # 只说方位
  ground_relation:     4    # 只说和周围什么挨着
  ground_contrast:     2    # 和图中同类比有什么不同
  ground_full:         6    # 综合三段式（原来唯一的一种，现在占七种的 20%）
  inventory_locate:   25    # 盘点 -> 定位 -> 描述（主线，count 已并入第一轮）
  ground_unique:      15    # 定位图中的卡车（主线，该类原始标注里仅一个实例）
  detect_class:        8    # 定位图中所有的人员（需该类全部框合格）
  region_identify:     7    # [框] 这个区域内的是什么（REG）
  exist_negative:      7    # 图中有没有直升机 / 拒答
  attribute_qa:        5    # [框] 这个区域内物体的颜色是什么
  spatial_relation:    3    # 卡车在人员的哪一侧（纯坐标，零成本）
# image_caption 已移除：描述性内容在主线第二轮已经有了，整图描述靠拼接
# 各目标描述，读起来断裂重复，不如不要。

# 配比是【产出配比】还是【槽位配比】。
#   strict  主线欠账时优先补主线，补不上就空过这个槽位。配比准，单图产量略低。
#   fill    优先填满槽位，主线出不来就让给非主线。产量高，配比会偏。
# 默认 strict：数据量的瓶颈从来不在单张图能出几条，而在有多少张图。
# 实测 VisDrone 300 图，fill 模式下主线配 70% 实得 41%，兜底任务把份额吃光了。
tasks_ratio_mode: strict

short_answer_ratio: 0.14

# ---------------------------------------------------------------------------
# refer_locate 的第 3、4 步（策略骨架和句式库是第 1、2 步，纯规则、零成本）
# ---------------------------------------------------------------------------
refer_locate:
  # 第 3 步：口语化改写。规则出的骨架句偏书面，让模型润色成口语。
  # 纯文本调用，不发图片、不给坐标 —— 给了坐标模型只会把坐标翻译成方位词。
  rewrite: true

  # 第 4 步：反向验证。把指代连同原图喂回模型让它出框，与原框 IoU 达标才保留。
  # 这是 ReferItGame「点对了才收录」机制的自动化版本，也是整条链路上唯一
  # 可证伪的质量闸 —— 前面几步都是启发式。
  #
  # 开启前务必先跑 scripts/calibrate_verifier.py 标定：验证器自己的定位能力
  # 也有限，IoU 不达标可能是指代不好、也可能是验证器不准，不标定就定阈值会误杀。
  verify: false
  verify_iou_threshold: 0.5

# 主线（指代物体 -> 框 -> 描述语句）是否强制三段齐全。
# 开启时，VLM 没有为该目标产出描述就不出这条主线样本 —— 主线的定义就是三段，
# 缺了描述只剩「指代 -> 框」，与定义不符（实测关闭时 40% 的主线样本缺描述）。
main_line_requires_description: true

# 描述短于这个字数、或通篇只有「轮廓清晰」「位于道路旁」这类放到哪张图都成立的
# 套话时，判为空话丢弃。描述的用处是让人照着能在图上找到目标，空话做不到这一点。
min_description_len: 18

# 类别量词表（船「艘」、车「辆」、人「名」）。
# 由 scripts/build_measure_words.py 一次性生成 —— 量词只跟类别有关、
# 跟图片无关，不必每张图去问。文件不存在时全部退回「个」，不影响构建。
measure_words_path: "config/measure_words.yaml"

# ---------------------------------------------------------------------------
# 采样
# ---------------------------------------------------------------------------
sampling:
  samples_per_image_cap: 8            # 同一张图最多产出多少条样本
  multi_target_ratio: 0.10            # 一次涉及 2~3 个目标的样本占比
  multi_target_max: 3
  negative_ratio: 0.05                # 拒答样本占比（问图中不存在的类别）
  seed: 20260826                      # 固定种子，保证可复现
  # 一张图让 VLM 最多挑几个「清晰、好指认」的目标。挑得多则主线样本多
  # （主线要求有描述），但「只挑最清晰的」这个意图会被稀释。
  vlm_max_pick: 8

# ---------------------------------------------------------------------------
# train/val 划分。必须按【原始来源】分组，不能按图片随机分 ——
# 数据含视频抽帧和 Roboflow 增强，同源图会泄漏到验证集。
# ---------------------------------------------------------------------------
split:
  val_ratio: 0.05
  group_by_source: true

output:
  format: sharegpt
  # images 字段写什么：
  #   filename（默认）  裸文件名，LLaMA-Factory 按它的 media_dir 拼
  #   absolute          绝对路径，省掉配 media_dir 这一步
  #   relative          原样保留配置里给的相对路径，分隔符统一成正斜杠
  image_path_style: filename
  # metadata 训练时用不到，但筛数据全靠它（按 task_type 挑任务、按 is_main_line
  # 挑主线、按 answer_format 挑短答案）。设 false 只影响落盘，构建全程照常使用。
  include_metadata: true
  # 坐标答案要不要用 ```json 代码块包起来。
  # Qwen3-VL 基座自带这个习惯 —— 直接问它「框出图中全部的轿车」，返回的是
  #     ```json
  #     [{"bbox_2d": [494, 709, 530, 819], "label": "轿车"}]
  #     ```
  # false（默认）裸 JSON，省 token，下游 json.loads 直接能解析
  # true         带包裹，与基座输出一致，已有解析器不用改
  # 训练会把数据里的格式教给模型，两种都行 —— 按你下游解析器来定。
  wrap_json_in_code_block: false
