# ============================================================================
# 预设：部件级标注 / 中大分辨率数据
#
# 用法（追加到你的 local.yaml 末尾，不是替换）：
#     cat config/preset_part_level.yaml >> config/local.yaml
#     python scripts/analyze.py
#
# 适用于什么数据：标注对象是【部件】而不是【整体】——机头/机尾/机翼/机身/
# 机轮/炮塔/炮管/履带/头灯这类。这种标注下「同类目标在一张图里重复」是常态
# （一架飞机 2 个机翼、3 个以上机轮），不是难度信号。
#
# 阈值按下面这份实测分布定的，14726 张图 / 153823 个框 / 248 类：
#     每图框数    中位 4    p75 10   p90 22   p95 36   最大 541
#     短边像素    p5 11.0   p10 14.0 p25 23.0 中位 45.2
#     面积占比    p5 0.016% p10 0.028% p25 0.072% 中位 0.317%
#     等效像素    p5 12.9   p25 27.5   中位 57.7
#     同类目标数  中位 10   p75 36   p90 84   p95 136  p99 232  最大 541
#     剔除归因    只因密集度 26.1%   只因尺寸 5.8%   都不过 5.5%
#
# 【换一份数据一定要重跑 analyze.py 再定】，别直接套。清洗过和没清洗过的
# 分布差很多，未清洗的通常有更多超小框和全图框。
# ============================================================================

quality:
  # 原值 0.001 换算成等效边长是 32.4px，比 difficulty.size_reject_px=16 还严，
  # 会让后者完全失效（尺寸维度永远判不出 hard），而且一口气剔掉 30.9% 的框。
  # 0.0002 对应等效 14.5px，落在 p5 附近，只砍真正看不清的那一小撮。
  min_area_ratio: 0.0002
  max_area_ratio: 0.5

  # 原值 16 剔掉 12.8%。这份数据短边中位数才 45.2px，10px 剔掉约 4.5%。
  min_short_side_px: 10

difficulty:
  # 原值 64 卡在等效像素的【中位数之上】(57.7)，意味着一半以上的框在尺寸
  # 维度就够不到 easy。40 让约六成落进 easy。
  size_easy_px: 40
  size_medium_px: 24
  # 15 ≈ 等效像素的 p5(12.9) 稍上方，只剔最小的那 5~6%。
  # 【必须 >= min_area_ratio 换算出的等效边长】(0.0002 -> 14.5px)，否则这道闸
  # 排在 min_area 后面、永远轮不到它生效，Grader.config_conflicts() 会报出来。
  size_reject_px: 15

  # 部件级标注的关键调整，也是这份数据里影响最大的一项。
  # 原值 3/8 是按物体级标注定的（一张图里同一类车出现 4 次就算密集）。
  #
  # 【按实测的同类目标数分位定】：中位 10、p75 36、p90 84、p95 136、最大 541。
  # 注意这是「同一张图里和它同类的框有几个」，不是「每图框数」——
  # 两者差很多，照后者调会调错。
  #
  #   dense_medium=36  取 p75，三成的数据算「同类密集」，其余进简单档。
  #                    定成 10（中位数）的后果实测过：47.1% 的框被压到简单档
  #                    以外，而简单档是困难配额的分母，直接把总产出砍掉。
  #   dense_hard=200   取 p99 附近，只剔同类超过 200 个的极端图（2.3%）。
  #                    定成 25 的后果实测过：31.6% 的框被剔除，是当时 37.4%
  #                    reject 里的绝对主因，而尺寸只占 11.3%。
  #                    密集目标对「框出所有X」「这个框里是什么」这些任务完全
  #                    可用，不该整个扔掉；它难在「单独指代」，而那由难度档
  #                    和各任务自己的闸去管。
  dense_medium: 36
  dense_hard: 200

  hard_quota: 0.10
